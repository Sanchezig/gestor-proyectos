<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROD - WTW - Gestor de Proyectos</title>
	<link rel="icon" type="image/x-icon" href="calendar.ico">
	<link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <img src="logo.png?v=20260521b" alt="P&OI" class="login-logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
            <div class="login-logo-fallback" style="display:none;">P&amp;OI</div>
            <h1 class="login-title">Gestor de Proyectos</h1>

            <div class="login-form">
                <label class="visually-hidden" for="loginInitials">Iniciales</label>
                <input type="text" id="loginInitials" class="login-input" placeholder="Iniciales (ej: IS)" autocomplete="username" maxlength="6">
                <label class="visually-hidden" for="loginPassword">Contraseña</label>
                <input type="password" id="loginPassword" class="login-input" placeholder="Contraseña" autocomplete="current-password">
                <button class="login-button" id="loginButton" type="button">Entrar</button>
                <div class="login-error" id="loginError" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <div id="appShell" class="app-shell app-shell--hidden">
    <div class="container">
        <div class="sidebar" id="sidebar">
            <button class="sidebar-toggle-btn" id="sidebarToggle" onclick="toggleSidebar()" title="Contraer panel" aria-label="Contraer panel">◀</button>
            <div class="sidebar-logo">WTW</div>
            <div class="sidebar-subtitle">Gestor de proyectos</div>
            <button class="btn-new-project" onclick="openNewProjectModal()">✨ Nuevo proyecto</button>

            <div class="sidebar-content">
                <div class="sidebar-title">Activos</div>
                <ul class="sidebar-list" id="projectsListActive"></ul>

                <div class="sidebar-title">Completados</div>
                <ul class="sidebar-list" id="projectsListCompleted"></ul>
            </div>

            <!-- Control de usuario -->
            <div class="user-control">
                <div class="user-icon">👤</div>
                <div class="user-info">
                    <button class="user-change-btn" onclick="changeUser()">Ajustes</button>
                    <button class="user-change-btn" onclick="logoutCurrentUser()">Salir</button>
                </div>
            </div>
        </div>


        <div class="main-content">
            <div class="toolbar">
                <div class="toolbar-left">
                    <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-label="Abrir menú de proyectos" aria-controls="sidebar" aria-expanded="false" onclick="toggleMobileSidebar()">☰</button>
                    <h2 id="viewTitle">Daily</h2>
                </div>
                <div class="view-toggle">
                    <button class="active" onclick="switchView('daily')">📅 Daily</button>
                    <button onclick="switchView('ficha')">📋 Ficha Proyecto</button>
                    <button onclick="switchView('equipo')">👥 Equipo</button>
					<button onclick="switchView('dashboard')">📈Dashboard</button>
                </div>
            </div>

            <div class="content-area">
                <div class="daily-view active" id="dailyView">
                    <div class="week-navigation">
                        <button class="week-nav-btn" onclick="previousWeek()">← Semana anterior</button>
                        <div class="week-info" id="weekInfo"></div>
                        <button class="week-nav-btn" onclick="nextWeek()">Semana siguiente →</button>
                    </div>

                    <div class="daily-mode-bar">
                        <div class="daily-mode-toggle">
                            <button id="btnDailyActivos" class="active"
                                onclick="setDailyViewMode('activos')">Activos</button>
                            <button id="btnDailyCompletados" onclick="setDailyViewMode('completados')">Completados</button>
                        </div>
                        <div id="dailyRespFilter" class="daily-resp-filter-inline"></div>
                    </div>

                    <div id="dailyTableContainer"></div>
                </div>

                <div class="project-ficha" id="fichaView"></div>

                <!-- VISTA EQUIPO -->
                <div class="team-view" id="teamView"></div>
				<div class="dashboard-view" id="dashboardView"></div>
            </div>
        </div>
    </div>
    <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Cerrar menú de proyectos" onclick="closeMobileSidebar()"></button>

    <div class="modal" id="dailyModal">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="dailyModalTitle">
            <div class="modal-title" id="dailyModalTitle">Nuevo comentario Daily</div>
            <div class="form-group">
                <label for="commentProjectSelect">Proyecto</label>
                <select id="commentProjectSelect" onchange="updateAvailableTasks()">
                    <option value="">Selecciona un proyecto...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="commentResponsible">Responsable</label>
                <select id="commentResponsible">
                    <option value="">Selecciona...</option>
                    <option value="IS">IS</option>
                    <option value="HR">HR</option>
                    <option value="PU">PU</option>
                    <option value="AR">AR</option>
                    <option value="MR">MR</option>
                </select>
            </div>
            <div class="form-group">
                <label for="commentUrgency">Urgencia</label>
                <select id="commentUrgency">
                    <option value="Normal">Normal</option>
                    <option value="Alta">Alta</option>
                    <option value="Máxima">Máxima</option>
                </select>
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="commentIncident">
                    Tiene incidencia
                </label>
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="commentPersonal" onchange="onPersonalTaskToggle()">
                    Tarea personal (solo visible para mi)
                </label>
            </div>
            <div class="form-group">
                <label for="commentText">Comentario</label>
                <textarea id="commentText" placeholder="Escribe tu comentario..."></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="saveDailyComment()">Guardar</button>
                <button class="btn btn-cancel" onclick="closeDailyModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="modal" id="commentsListModal">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="commentsListTitle">
            <div class="modal-title" id="commentsListTitle">Comentarios del día</div>
            <div id="commentsListContainer"></div>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="openAddCommentFromList()">Añadir más</button>
                <button class="btn btn-cancel" onclick="closeCommentsListModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <div class="modal" id="dayPersonalTasksModal">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="dayPersonalTasksTitle">
            <div class="day-personal-modal-header">
                <button class="btn btn-cancel day-personal-nav-btn" onclick="previousDayPersonalTasksDate()">◀</button>
                <div class="modal-title" id="dayPersonalTasksTitle">Tareas personales del dia</div>
                <button class="btn btn-cancel day-personal-nav-btn" onclick="nextDayPersonalTasksDate()">▶</button>
            </div>

            <div id="dayPersonalTasksList"></div>

            <div class="day-personal-add-row">
                <label class="visually-hidden" for="dayPersonalTaskInput">Nueva tarea personal del día</label>
                <input type="text" id="dayPersonalTaskInput" placeholder="Nueva tarea personal del dia..." onkeydown="if(event.key==='Enter') addDayPersonalTask()">
                <button class="btn btn-primary" onclick="addDayPersonalTask()">Añadir</button>
            </div>

            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeDayPersonalTasksModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <div class="modal" id="vacationOptionsModal">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="vacationOptionsTitle">
            <div class="modal-title" id="vacationOptionsTitle">Asignar vacaciones</div>
            <p class="vacation-selection-label" id="vacationSelectionLabel"></p>
            <div class="form-group">
                <label for="vacationTypeSelect">Imputar al saldo</label>
                <select id="vacationTypeSelect"></select>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-primary" type="button" onclick="saveVacationSelection()">Guardar</button>
                <button class="btn btn-cancel" type="button" onclick="closeVacationOptionsModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="modal" id="userSettingsModal">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="userSettingsTitle">
            <div class="modal-title" id="userSettingsTitle">Ajustes de usuario</div>

            <div class="form-group">
                <label for="settingsInitials">Iniciales</label>
                <input type="text" id="settingsInitials" maxlength="6" placeholder="Ej: IS">
            </div>

            <div class="form-group">
                <label for="settingsEmail">Email</label>
                <input type="email" id="settingsEmail" placeholder="nombre.apellido@wtwco.com">
            </div>

            <div class="form-group">
                <label for="settingsPassword">Nueva contraseña</label>
                <input type="password" id="settingsPassword" placeholder="Dejar vacío para no cambiar">
            </div>

            <div class="form-group">
                <label for="settingsPasswordConfirm">Confirmar nueva contraseña</label>
                <input type="password" id="settingsPasswordConfirm" placeholder="Repite la nueva contraseña">
            </div>

            <div class="login-error" id="settingsError" aria-live="polite"></div>

            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="saveUserSettings()">Guardar</button>
                <button class="btn" onclick="logoutCurrentUser()">Cerrar sesión</button>
                <button class="btn btn-cancel" onclick="closeUserSettingsModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="modal" id="projectModal">
        <div class="modal-content modal-project" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
            <div class="modal-title" id="projectModalTitle">Crear nuevo proyecto</div>
            <div class="form-group">
                <label for="projectName">Nombre de la iniciativa</label>
                <input type="text" id="projectName" placeholder="Ej: Automatización de Claims...">
            </div>
            <div class="form-group">
                <label for="projectStartDate">Fecha inicio</label>
                <input type="date" id="projectStartDate">
            </div>
            <div class="form-group">
                <label for="projectEndDate">Fecha fin</label>
                <input type="date" id="projectEndDate">
            </div>
            <div class="form-group">
                <label for="projectPhase">Fase del proyecto</label>
                <select id="projectPhase">
                    <option value="Idea">Idea</option>
                    <option value="En Progreso">En Progreso</option>
                    <option value="On Hold">On Hold</option>
                    <option value="Mantenimiento">Mantenimiento</option>
                    <option value="Hypercare">Hypercare</option>
                    <option value="Cerrado">Cerrado</option>
                </select>
            </div>
            <div class="form-group">
                <label for="projectStakeholders">Stakeholders</label>
                <input type="text" id="projectStakeholders" placeholder="Ej: Juan (Product Owner), María (IT), ...">
            </div>
            <div class="form-group">
                <label for="volume">Ahorro (€)</label>
                <input type="number" id="volume" placeholder="Ej: 50000" min="0" step="0.01">
            </div>
            <div class="form-group">
                <label for="fte">Ahorro (FTE)</label>
                <input type="number" id="fte" placeholder="Ej: 1.5" min="0" step="0.1">
            </div>

            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="saveNewProject()">Crear proyecto</button>
                <button class="btn btn-cancel" onclick="closeProjectModal()">Cancelar</button>
            </div>
        </div>
    </div>

    </div>

	<script src="config.js"></script>
	<script src="app.js"></script>
</body>

</html>
